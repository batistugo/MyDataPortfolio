project:
  type: website
  render:
    - index.Rmd
    - project01.Rmd
    - project02.Rmd
    - project03.qmd
    - project04.qmd
    - project05.Rmd
    - project06_1.Rmd
    - project06_2.Rmd

# two languages, rendered by render.ps1 / render.sh (English first, then Portuguese):
#   quarto render --profile en   ->  docs/      (English, current URLs)
#   quarto render --profile pt   ->  docs/pt/   (Portuguese)
profile:
  default: en

# no freeze: each language executes its own code, so plot labels follow the language
execute:
  freeze: false

format:
  html:
    theme: cosmo
    toc: true
    code-fold: false
    title-block-style: none
    include-after-body: lang-toggle.html
