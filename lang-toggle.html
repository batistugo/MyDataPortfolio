<style>
/* language switch: a highlighted button on the right side of the navbar */
a.nav-link.lang-switch {
  background-color: #2780e3;
  color: #fff !important;
  border-radius: 999px;
  padding: 0.3rem 1rem !important;
  margin: 0.25rem 0;
  font-weight: 600;
  white-space: nowrap;
}
a.nav-link.lang-switch:hover,
a.nav-link.lang-switch:focus {
  background-color: #1a68c2;
  color: #fff !important;
}
/* on small screens the menu collapses: a copy of the button is shown at the top of the page */
.lang-switch-bar { display: none; }
@media (max-width: 991.98px) {
  .lang-switch-bar { display: block; text-align: right; margin: 0 0 0.75rem 0; }
  .lang-switch-bar a.nav-link.lang-switch { display: inline-block; font-size: 0.9rem; margin: 0; }
  li.lang-switch-item { display: none; }
}
</style>

<script>
// 1) the browser tab shows the title of the page in its own language
// 2) the language button of the navbar opens the same page in the other language
document.addEventListener("DOMContentLoaded", function () {
  var titulo = document.querySelector("main .page-title");
  if (titulo) document.title = titulo.textContent.trim().replace(/\s+/g, " ") + " – MyDataPortfolio";

  var isPt = (document.documentElement.lang || "").indexOf("pt") === 0;
  var page = location.pathname.split("/").pop() || "index.html";
  document.querySelectorAll("a.nav-link").forEach(function (a) {
    var text = a.textContent.trim();
    if ((isPt && text === "EN Version") || (!isPt && text === "Versão em PT")) {
      a.classList.add("lang-switch");
      a.setAttribute("href", (isPt ? "../" : "pt/") + page);
      a.setAttribute("title", isPt ? "Read this page in English" : "Ler esta página em português");
      a.setAttribute("lang", isPt ? "en" : "pt-BR");
      a.parentElement.classList.add("lang-switch-item");

      var main = document.querySelector("main");
      if (main) {
        var barra = document.createElement("div");
        barra.className = "lang-switch-bar";
        barra.appendChild(a.cloneNode(true));
        main.insertBefore(barra, main.firstChild);
      }
    }
  });
});
</script>
